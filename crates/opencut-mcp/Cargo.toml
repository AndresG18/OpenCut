[package]
name = "opencut-mcp"
description = "Local MCP server for agent-driven OpenCut clip discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clip-finder = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = "1"
time = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
